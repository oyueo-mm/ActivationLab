<!doctype html>

  <title>ActivationLab — 활성화 함수 도감</title>

  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div id="app" class="app">
  <aside class="sidebar" id="sidebar" aria-label="함수 분류">
    <a class="brand" href="#/home" aria-label="ActivationLab 홈"><span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 23h11l7-15h8"/></svg></span><span class="brand-label">Activation<span>Lab</span></span></a><button type="button" class="sidebar-collapse-button" id="sidebar-collapse" aria-label="사이드바 접기" aria-expanded="true" title="사이드바 접기">‹</button>
    <nav class="nav-main" aria-label="화면 선택"><button type="button" class="nav-item active" data-page="home" title="홈"><span class="nav-icon" aria-hidden="true">⌂</span><span class="nav-label">홈</span></button><button type="button" class="nav-item" data-page="catalog"><span class="nav-icon">▦</span><span class="nav-label">도감</span><span id="nav-count" class="nav-counter"></span></button><button type="button" class="nav-item" data-page="compare"><span class="nav-icon">⊞</span><span class="nav-label">비교</span><span id="compare-badge" class="nav-counter">0/4</span></button></nav>
    <nav class="categories" id="categories" aria-label="함수 계열 선택"></nav>
    <div class="sidebar-bottom"><a href="https://github.com/oyueo-mm/ActivationLab" target="_blank" rel="noopener noreferrer" aria-label="GitHub 저장소" title="GitHub 저장소"><span aria-hidden="true">↗</span></a></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="workspace">
    <header class="topbar"><button type="button" id="mobile-menu" class="icon-button menu-toggle" aria-label="메뉴 열기">☰</button><span class="mobile-top-title">ActivationLab</span><div class="header-actions"><button type="button" id="reset-view" class="text-button reset-icon" title="검색·필터 초기화" aria-label="검색·필터 초기화">↺</button><a href="https://github.com/oyueo-mm/ActivationLab" class="github-link" target="_blank" rel="noopener noreferrer" aria-label="GitHub 저장소" title="GitHub 저장소">↗</a></div></header>
    <main class="main" id="main">
      <section id="home-view" class="view home-view"><div class="home-layout"><div class="home-intro"><h1>활성화 함수<br><span>도감</span><span class="home-title-dot">.</span></h1><p>함수의 형태를 보고 직접 비교해 보세요.</p><div class="home-actions"><button type="button" class="home-primary" data-page="catalog">도감 살펴보기 <span aria-hidden="true">→</span></button><button type="button" class="home-secondary" data-page="compare">함수 비교 <span aria-hidden="true">↗</span></button></div><span class="home-count"><span id="home-total">82</span>개의 활성화 함수</span></div><div class="home-visual" id="home-visual" aria-label="네 가지 활성화 함수의 움직이는 그래프"><div class="home-cards" id="home-cards"></div></div></div></section>
      <section id="catalog-view" class="view" hidden>
                <div class="toolbar"><label class="search-field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.6"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="함수 검색" autocomplete="off" aria-label="활성화 함수 검색"></label><select id="kind-filter" class="select-filter" aria-label="함수 유형"><option value="all">전체 유형</option><option value="scalar">스칼라 함수</option><option value="vector">벡터 함수</option><option value="gated">게이트 함수</option></select><select id="property-filter" class="select-filter" aria-label="함수 특성"><option value="all">전체 특성</option><option value="smooth">매끄러운 함수</option><option value="nonmonotonic">비단조 함수</option><option value="parametric">매개변수 조절</option></select></div>
        <div class="section-heading"><div><h2 id="listing-title">전체</h2><span id="result-count">—</span></div></div>
        <div id="catalog-grid" class="catalog-grid"></div><div id="empty-state" class="empty-state" hidden><strong>검색 결과가 없습니다.</strong><span>다른 검색어나 분류를 선택해 보세요.</span><button type="button" id="clear-filters" class="primary-button">필터 초기화</button></div>
      </section>
      <section id="compare-view" class="view" hidden><div class="compare-mini-title">비교</div><div class="compare-panel"><div class="compare-controls"><div class="compare-options"><label class="switch-label"><input type="checkbox" id="compare-derivative"><span>도함수 비교</span></label><button type="button" id="compare-clear" class="text-button">선택 초기화</button></div><div id="compare-selects" class="compare-selects"></div></div><div class="compare-chart-container"><svg id="compare-chart" viewBox="0 0 760 360" preserveAspectRatio="xMidYMid meet" role="img" aria-label="활성화 함수 비교 그래프"></svg><div id="compare-legend" class="chart-legend"></div></div><div id="compare-properties" class="compare-properties"></div><details class="compare-help"><summary aria-label="비교 안내">ⓘ</summary><p>동일한 입력 범위에서 비교합니다. 도함수는 수치 미분으로 근사하며 불연속점에서는 생략할 수 있습니다.</p></details></div></section>
      
    </main>
  </div>
  <div id="drawer-layer" class="drawer-layer" hidden><div class="drawer-backdrop" id="drawer-backdrop"></div><section id="detail-drawer" class="detail-drawer" role="dialog" aria-modal="true" aria-labelledby="detail-title"><div id="drawer-content"></div></section></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
